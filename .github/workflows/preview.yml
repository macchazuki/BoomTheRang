name: Deploy PR Preview

on:
  pull_request:
    types: [opened, synchronize, reopened, closed]

permissions:
  contents: read

concurrency:
  group: github-pages-preview
  cancel-in-progress: true

jobs:
  build:
    name: Build preview
    if: github.event.action != 'closed' && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci --no-audit --no-fund --ignore-scripts

      - name: Build preview site
        run: npm run build -- --base "/BoomTheRang/pr-preview/pr-${{ github.event.number }}/"

      - name: Upload preview artifact
        uses: actions/upload-artifact@v4
        with:
          name: pr-preview-dist
          path: ./dist
          retention-days: 1

  deploy:
    name: Deploy preview
    needs: build
    if: github.event.action != 'closed' && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write

    steps:
      - name: Check out Pages branch
        uses: actions/checkout@v4
        with:
          ref: gh-pages

      - name: Download preview artifact
        uses: actions/download-artifact@v4
        with:
          name: pr-preview-dist
          path: ./dist

      - name: Deploy preview
        uses: rossjrw/pr-preview-action@v1
        with:
          source-dir: ./dist/
          preview-branch: gh-pages
          wait-for-pages-deployment: true
          qr-code: false

  cleanup:
    name: Remove preview
    if: github.event.action == 'closed' && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write

    steps:
      - name: Check out Pages branch
        uses: actions/checkout@v4
        with:
          ref: gh-pages

      - name: Remove preview
        uses: rossjrw/pr-preview-action@v1
        with:
          preview-branch: gh-pages
          action: remove
          wait-for-pages-deployment: true
          qr-code: false
